<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet CSS 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="Positionnement">

    <!-- l'option basic qui va servir de base pour les deux autres cartes -->
    <div class="CarteChoix">
      <div class="entete" id="couleurBasic">
        <div class="titre">Basic</div>
      </div>
      <div class="Prix">
        <div>
          <div class="devise">$</div>
          <div class="prixEntier">29</div>
          <div class="centimes">99</div>
        </div>
        <div class="Periode">per month</div>
      </div>
      <div class="Features">15 Email Accounts</div>
      <div class="Features">100GB Space</div>
      <div class="Features">1 Domain Name</div>
      <div class="Features">500GB Bandwidth</div>
      <button class="AjoutPanier">Add to cart</button>
    </div>

    <!-- l'option pro -->
    <div class="CarteChoix">
      <div class="entete" id="couleurPro">
        <div class="titre">Pro</div>
      </div>
      <div class="Prix">
        <div>
          <div class="devise">$</div>
          <div class="prixEntier">49</div>
          <div class="centimes">99</div>
        </div>
        <div class="Periode">per month</div>
      </div>
      <div class="Features">15 Email Accounts</div>
      <div class="Features">100GB Space</div>
      <div class="Features">1 Domain Name</div>
      <div class="Features">500GB Bandwidth</div>
      <button class="AjoutPanier">Add to cart</button>
    </div>

    <!-- l'option premium -->
    <div class="CarteChoix">
      <div class="entete" id="couleurPremium">
        <div class="titre">Premium</div>
      </div>
      <div class="Prix">
        <div>
          <div class="devise">$</div>
          <div class="prixEntier">79</div>
          <div class="centimes">99</div>
        </div>
        <div class="Periode">per month</div>
      </div>
      <div class="Features">15 Email Accounts</div>
      <div class="Features">100GB Space</div>
      <div class="Features">1 Domain Name</div>
      <div class="Features">500GB Bandwidth</div>
      <button class="AjoutPanier">Add to cart</button>
    </div>

  </div>

</body>
</html>
